<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210">
  <!-- macOS dialog - modern Ventura/Sonoma style -->
  <defs>
    <filter id="dialog-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="btn-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>
  <!-- Dialog background -->
  <rect x="10" y="6" width="400" height="198" rx="14" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="0.5" filter="url(#dialog-shadow)"/>
  <!-- Warning icon (macOS style shield) -->
  <circle cx="56" cy="60" r="24" fill="#f5c542"/>
  <text x="56" y="68" text-anchor="middle" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="26" fill="#fff" font-weight="bold">!</text>
  <!-- Main text -->
  <text x="92" y="48" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="14" fill="#1d1d1f" font-weight="600">"setup-mac.command" can't be opened</text>
  <text x="92" y="66" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="14" fill="#1d1d1f" font-weight="600">because it is from an unidentified developer.</text>
  <!-- Secondary text -->
  <text x="92" y="92" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="11.5" fill="#86868b">macOS cannot verify that this app is free from malware.</text>
  <text x="92" y="108" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="11.5" fill="#86868b">Right-click the file and select "Open" to bypass this.</text>
  <!-- Buttons - macOS style -->
  <rect x="198" y="140" width="96" height="32" rx="6" fill="#e8e8e8"/>
  <text x="246" y="160" text-anchor="middle" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="13" fill="#1d1d1f">Cancel</text>
  <rect x="304" y="140" width="90" height="32" rx="6" fill="url(#btn-blue)"/>
  <text x="349" y="160" text-anchor="middle" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="600">Open</text>
  <!-- Arrow callout -->
  <text x="349" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#0071e3" font-weight="600">&#x2193; click this</text>
</svg>
