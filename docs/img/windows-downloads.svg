<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200">
  <!-- Windows 11 File Explorer window -->
  <rect width="520" height="200" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Title bar - Windows 11 style -->
  <rect width="520" height="36" rx="8" fill="#f3f3f3"/>
  <rect y="28" width="520" height="8" fill="#f3f3f3"/>
  <!-- Window controls (right side, Win11 style) -->
  <rect x="430" y="10" width="12" height="1.5" rx="0.5" fill="#666"/>
  <rect x="452" y="6" width="12" height="12" rx="1" fill="none" stroke="#666" stroke-width="1.5"/>
  <line x1="478" y1="8" x2="490" y2="20" stroke="#666" stroke-width="1.5"/>
  <line x1="490" y1="8" x2="478" y2="20" stroke="#666" stroke-width="1.5"/>
  <!-- Folder icon in title -->
  <rect x="12" y="10" width="16" height="12" rx="2" fill="#f5c542"/>
  <rect x="12" y="8" width="8" height="4" rx="1" fill="#f5c542"/>
  <text x="36" y="22" font-family="Segoe UI, sans-serif" font-size="12" fill="#1a1a1a">Downloads</text>
  <!-- Address bar -->
  <rect x="12" y="44" width="496" height="28" rx="4" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="62" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">&#x1F4C1; &gt; This PC &gt; Downloads</text>
  <!-- Toolbar divider -->
  <line x1="0" y1="80" x2="520" y2="80" stroke="#e8e8e8" stroke-width="1"/>
  <!-- File row - highlighted -->
  <rect x="4" y="88" width="512" height="48" rx="4" fill="#e8f0fe"/>
  <!-- File icon - PowerShell blue -->
  <rect x="16" y="96" width="32" height="32" rx="3" fill="#012456"/>
  <text x="32" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#fff" font-weight="bold">PS1</text>
  <!-- File details -->
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="13" fill="#1a1a1a" font-weight="500">setup-windows.ps1</text>
  <text x="60" y="126" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">4 KB &middot; PowerShell Script &middot; Today</text>
  <!-- Status bar -->
  <rect y="156" width="520" height="44" rx="0" fill="#f9f9f9"/>
  <rect y="156" width="520" height="1" fill="#e8e8e8"/>
  <text x="16" y="182" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">1 item</text>
</svg>
