<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180">
  <!-- Window chrome -->
  <rect width="480" height="180" rx="8" fill="#fff" stroke="#d0d0d0" stroke-width="1"/>
  <rect width="480" height="32" rx="8" fill="#f0f0f0"/>
  <rect y="24" width="480" height="8" fill="#f0f0f0"/>
  <!-- Traffic lights -->
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="32" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="48" cy="16" r="5" fill="#28c840"/>
  <!-- Title bar -->
  <text x="240" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">Downloads</text>
  <!-- Path bar -->
  <rect x="12" y="40" width="456" height="24" rx="4" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="56" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">This PC > Downloads</text>
  <!-- File icon and name -->
  <rect x="24" y="80" width="44" height="44" rx="4" fill="#e8edff" stroke="#4361ee" stroke-width="1"/>
  <text x="46" y="106" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4361ee" font-weight="bold">PS1</text>
  <text x="24" y="142" font-family="Segoe UI, sans-serif" font-size="12" fill="#1a1a2e" font-weight="600">setup-windows.ps1</text>
  <text x="24" y="158" font-family="Segoe UI, sans-serif" font-size="10" fill="#888">4 KB — PowerShell Script</text>
</svg>
