<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240">
  <!-- macOS Terminal window -->
  <rect width="560" height="240" rx="10" fill="#1e1e1e"/>
  <!-- Title bar - macOS style -->
  <rect width="560" height="28" rx="10" fill="#333"/>
  <rect y="20" width="560" height="8" fill="#333"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="14" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="14" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="14" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="280" y="18" text-anchor="middle" font-family="-apple-system, SF Pro, Helvetica, sans-serif" font-size="12" fill="#aaa">setup-mac.command - 80x24</text>
  <!-- Terminal content -->
  <text x="16" y="52" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#ddd">========================================</text>
  <text x="16" y="70" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#ddd">  Get Me Started - Mac Setup</text>
  <text x="16" y="88" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#ddd">========================================</text>
  <text x="16" y="114" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#999">[1/4] Checking for developer tools...</text>
  <text x="16" y="132" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#28c840">  Already installed.</text>
  <text x="16" y="158" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#999">[2/4] Checking for Node.js...</text>
  <text x="16" y="176" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#28c840">  Node.js v22.12.0 is already installed.</text>
  <text x="16" y="202" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#999">[3/4] Checking for OpenCode...</text>
  <text x="16" y="220" font-family="SF Mono, Menlo, monospace" font-size="12.5" fill="#ffbd2e">  Installing OpenCode...</text>
</svg>
