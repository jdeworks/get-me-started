<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220">
  <!-- Terminal window -->
  <rect width="520" height="220" rx="8" fill="#1a1a2e"/>
  <!-- Title bar -->
  <rect width="520" height="28" rx="8" fill="#2d2d44"/>
  <rect y="20" width="520" height="8" fill="#2d2d44"/>
  <text x="260" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">Windows PowerShell</text>
  <!-- Terminal content -->
  <text x="16" y="56" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#888">[1/4] Checking for Git...</text>
  <text x="16" y="74" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#28c840">  git version 2.43.0 is already installed.</text>
  <text x="16" y="96" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#888">[2/4] Checking for Docker Desktop...</text>
  <text x="16" y="114" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#28c840">  Docker version 24.0.7 is already installed.</text>
  <text x="16" y="136" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#888">[3/4] Creating your Projects folder...</text>
  <text x="16" y="154" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#28c840">  Created C:\Projects</text>
  <text x="16" y="180" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#28c840" font-weight="bold">========================================</text>
  <text x="16" y="198" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#28c840" font-weight="bold">  All done!</text>
</svg>
