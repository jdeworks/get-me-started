<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240">
  <!-- Windows Terminal window -->
  <rect width="560" height="240" rx="8" fill="#0c0c0c"/>
  <!-- Title bar - Windows Terminal style -->
  <rect width="560" height="32" rx="8" fill="#1f1f1f"/>
  <rect y="24" width="560" height="8" fill="#1f1f1f"/>
  <!-- Tab -->
  <rect x="8" y="4" width="160" height="24" rx="6" fill="#0c0c0c"/>
  <text x="24" y="20" font-family="Segoe UI, sans-serif" font-size="11" fill="#ccc">Windows PowerShell</text>
  <!-- Window controls -->
  <rect x="480" y="12" width="12" height="1.5" rx="0.5" fill="#999"/>
  <rect x="502" y="8" width="12" height="12" rx="1" fill="none" stroke="#999" stroke-width="1.2"/>
  <line x1="524" y1="10" x2="534" y2="20" stroke="#999" stroke-width="1.2"/>
  <line x1="534" y1="10" x2="524" y2="20" stroke="#999" stroke-width="1.2"/>
  <!-- Terminal content -->
  <text x="16" y="56" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#6a9955">[1/4] Checking for Git...</text>
  <text x="16" y="74" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#4ec9b0">  git version 2.43.0 is already installed.</text>
  <text x="16" y="98" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#6a9955">[2/4] Checking for Docker Desktop...</text>
  <text x="16" y="116" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#4ec9b0">  Docker version 24.0.7 is already installed.</text>
  <text x="16" y="140" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#6a9955">[3/4] Creating your Projects folder...</text>
  <text x="16" y="158" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#4ec9b0">  Created C:\Projects</text>
  <text x="16" y="182" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#569cd6">========================================</text>
  <text x="16" y="200" font-family="Cascadia Mono, Consolas, monospace" font-size="13" fill="#4ec9b0" font-weight="bold">  All done!</text>
  <text x="16" y="218" font-family="Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#569cd6">========================================</text>
</svg>
