<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
  <!-- Background -->
  <rect width="360" height="260" rx="4" fill="#f0f0f0"/>
  <!-- Context menu -->
  <rect x="40" y="10" width="280" height="240" rx="8" fill="#fff" stroke="#d0d0d0" stroke-width="1" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Menu items -->
  <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Open</text>
  <line x1="48" y1="52" x2="312" y2="52" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="74" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Edit</text>
  <line x1="48" y1="84" x2="312" y2="84" stroke="#e8e8e8" stroke-width="1"/>
  <!-- Highlighted item -->
  <rect x="48" y="90" width="264" height="30" rx="4" fill="#e8edff"/>
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="13" fill="#4361ee" font-weight="600">Run with PowerShell</text>
  <!-- Arrow pointing to it -->
  <text x="320" y="110" font-family="Segoe UI, sans-serif" font-size="16" fill="#4361ee">&#x2190;</text>
  <line x1="48" y1="124" x2="312" y2="124" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="146" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Copy</text>
  <line x1="48" y1="156" x2="312" y2="156" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="178" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Cut</text>
  <line x1="48" y1="188" x2="312" y2="188" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="210" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Delete</text>
  <line x1="48" y1="220" x2="312" y2="220" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="242" font-family="Segoe UI, sans-serif" font-size="13" fill="#333">Properties</text>
</svg>
